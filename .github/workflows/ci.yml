name: KYC Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set CI environment variables
        run: |
          echo "JWT_SECRET_KEY=ci-test-secret-not-for-production" >> $GITHUB_ENV
          echo "JWT_ALGORITHM=HS256" >> $GITHUB_ENV
          echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30" >> $GITHUB_ENV

          echo "DATABASE_URL=postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db" >> $GITHUB_ENV

          echo "MINIO_ENDPOINT=localhost:9000" >> $GITHUB_ENV
          echo "MINIO_ACCESS_KEY=minioadmin" >> $GITHUB_ENV
          echo "MINIO_SECRET_KEY=minioadmin123" >> $GITHUB_ENV
          echo "MINIO_BUCKET_NAME=kyc-documents" >> $GITHUB_ENV

          echo "RABBITMQ_HOST=localhost" >> $GITHUB_ENV
          echo "RABBITMQ_PORT=5672" >> $GITHUB_ENV
          echo "RABBITMQ_USER=guest" >> $GITHUB_ENV
          echo "RABBITMQ_PASSWORD=guest" >> $GITHUB_ENV
          echo "RABBITMQ_QUEUE=kyc_processing" >> $GITHUB_ENV

      - name: Check Python imports
        working-directory: backend
        run: |
          python -c "import app.main; print('Backend import successful')"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build