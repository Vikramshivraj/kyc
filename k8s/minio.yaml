apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: kyc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: kyc-secrets
                key: MINIO_ROOT_USER

          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kyc-secrets
                key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      volumes:
        - name: minio-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: kyc-platform
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001