apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kyc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: kyc_user
            - name: POSTGRES_PASSWORD
              value: kyc_password
            - name: POSTGRES_DB
              value: kyc_db
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kyc-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432