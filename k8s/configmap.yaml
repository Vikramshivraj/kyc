apiVersion: v1
kind: ConfigMap
metadata:
  name: kyc-config
  namespace: kyc-platform
data:
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE: "kyc_processing"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET_NAME: "kyc-documents"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"