apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kyc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: kyc-platform-worker:latest
          imagePullPolicy: IfNotPresent
          
          envFrom:
            - secretRef:
                name: kyc-secrets
            - configMapRef:
                name: kyc-config

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"